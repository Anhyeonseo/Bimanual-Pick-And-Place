; 저장소 표준 시험 설정.
;
; `unittest discover`는 tests/ 76개 파일 중 unittest.TestCase를 쓰는 것만 수집한다.
; 나머지는 pytest 형식(tmp_path fixture 포함)이므로 pytest로만 전부 실행된다.
;
; 전체 회귀 (555 tests):
;     source /opt/ros/jazzy/setup.bash
;     source ros2_ws/install/setup.bash
;     python3 -m pytest -q
;
; ROS overlay(`ros2_ws/install/setup.bash`)를 source하지 않으면
; ament_index가 `single_arm_bridge` package를 찾지 못해
; tests/test_so101_backend_selector.py 등 launch 파일을 import하는 테스트가
; 실패한다.
;
; pythonpath 설정이 `tools/*.py`의 bare-name import(예: `from
; top_pick_place_application import ...`)를 성립시키는 근거다. 이 파일은
; 반드시 저장소 루트에 있어야 한다 — `pytest -c <다른 경로>`로 옮기면
; 상대경로 resolution이 깨진다(실측 확인됨).

[pytest]
testpaths = tests ros2_ws/src/single_arm_bridge/test
pythonpath = ros2_ws/src/single_arm_bridge tools/lib
